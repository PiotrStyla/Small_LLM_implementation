name: vision_assistant
description: "Asystent wzrokowy dla osób niewidomych — Gemma 3n w całości na urządzeniu (Android i iOS)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  # Silnik Gemma 3n on-device (LiteRT-LM, .litertlm) — obraz + tekst.
  flutter_gemma: ^1.9.0
  flutter_gemma_litertlm: ^1.8.0
  camera: ^0.12.1
  flutter_tts: ^4.2.5
  speech_to_text: ^7.5.0
  file_picker: ^13.1.0
  # Własny model SLAYER (goLLeM) w grafach ONNX + preprocessing obrazu.
  onnxruntime: ^1.4.1
  image: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
